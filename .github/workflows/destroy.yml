name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - stag
          - prod

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_VERSION: "1.10.0"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ENVIRONMENT: ${{ github.event.inputs.environment }}

jobs:
  terraform-plan-destroy:
    name: Terraform Plan Destroy
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select Terraform Workspace
        run: |
          terraform workspace select ${{ env.ENVIRONMENT }} || terraform workspace new ${{ env.ENVIRONMENT }}

      - name: Terraform Plan Destroy
        run: |
          terraform plan -destroy \
            -var-file="env/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}.tfvars" \
            -no-color -out=tfdestroyplan 2>&1 | tee destroy_plan_output.txt

      - name: Upload Destroy Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfdestroyplan-${{ env.ENVIRONMENT }}
          path: tfdestroyplan
          retention-days: 1

  manual-approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: terraform-plan-destroy
    if: success()

    permissions:
      issues: write
      contents: read

    steps:
      - name: Await Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: Raymond-Afuye
          minimum-approvals: 1
          issue-title: "⚠️ Manual Approval Required for Terraform DESTROY — ${{ github.event.inputs.environment }}"
          issue-body: |
            A Terraform **DESTROY** has been requested for environment: `${{ github.event.inputs.environment }}`.

            This will **permanently delete all infrastructure** in that environment.

            Comment `approve` to proceed or `deny` to cancel.
          exclude-workflow-initiator-as-approver: false

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: manual-approval

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select Terraform Workspace
        run: |
          terraform workspace select ${{ env.ENVIRONMENT }} || terraform workspace new ${{ env.ENVIRONMENT }}

      - name: Download Destroy Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfdestroyplan-${{ env.ENVIRONMENT }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Terraform Destroy
        run: terraform apply -auto-approve tfdestroyplan
